<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentar - Autenticación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <!-- Isotipo centralizado -->
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" class="mb-2">
                <rect width="48" height="48" rx="12" fill="#112238" stroke="#1e3653" stroke-width="1.5" />
                <path
                    d="M10 32C10 32 12.5 24 16 22C18 20.8 21.5 17 25 17H34C37 17 39.5 21 40.5 24.5L42 29C42.5 30.5 41.5 32 40 32H10Z"
                    fill="#3b82f6" />
                <circle cx="16.5" cy="32.5" r="4.5" fill="#0b1626" stroke="#93c5fd" stroke-width="2" />
                <circle cx="34.5" cy="32.5" r="4.5" fill="#0b1626" stroke="#93c5fd" stroke-width="2" />
            </svg>
            <h4 class="text-white mb-0">Iniciar Sesión</h4>
            <small class="text-secondary">Ingrese sus credenciales de Rentar</small>
        </div>

        <form id="form-login" onsubmit="ejecutarAutenticacion(event)">
            <div class="mb-3">
                <label class="form-label">Usuario o Email</label>
                <input type="text" class="form-control" id="login-user" required
                    placeholder="ej: admin o juan@rentar.com">
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="login-pass" required placeholder="••••••••">
            </div>
            <button type="submit"
                class="btn btn-primary w-100 py-2 d-flex align-items-center justify-content-center gap-2"
                id="btn-submit">
                <i data-lucide="lock" style="width: 16px; height: 16px;"></i> Ingresar
            </button>
        </form>

        <div id="login-error" class="mt-3"></div>

        <div class="text-center mt-3 border-top border-secondary pt-3">
            <a href="index.html" class="text-secondary small text-decoration-none">
                ← Volver a la portada
            </a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        lucide.createIcons();

        async function ejecutarAutenticacion(e) {
            e.preventDefault();

            const usuario = document.getElementById('login-user').value.trim();
            const contrasena = document.getElementById('login-pass').value.trim();
            const errorDiv = document.getElementById('login-error');
            const btnSubmit = document.getElementById('btn-submit');

            errorDiv.innerHTML = '';

            if (!usuario || !contrasena) {
                errorDiv.innerHTML = `<div class="alert alert-warning py-2 mb-0">Complete todos los campos.</div>`;
                return;
            }

            // Feedback visual mientras viaja por el Gateway y gRPC
            const textoOriginal = btnSubmit.innerHTML;
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `Ingresando...`;

            try {
                // Petición REST al API Gateway (FastAPI en :8000)
                const res = await fetch("http://localhost:8000/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        username: usuario, 
                        password: contrasena 
                    })
                });

                if (!res.ok) {
                    const error = await res.json();
                    errorDiv.innerHTML = `<div class="alert alert-danger py-2 mb-0">${error.detail || "Credenciales incorrectas"}</div>`;
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = textoOriginal;
                    return;
                }

                const data = await res.json();

                // Persistir sesión y credenciales
                localStorage.setItem("token", data.token);
                localStorage.setItem("rol", data.rol);
                localStorage.setItem("username", data.username);
                if (data.clienteId) {
                    localStorage.setItem("clienteId", data.clienteId);
                }

                // Redirección según rol (Requerimientos 1, 2, 3, 4 y 5 del TP)
                if (data.rol === "ADMINISTRADOR" || data.rol === "ROLE_ADMIN") {
                    window.location.href = "admin/dashboard.html";
                } else {
                    window.location.href = "cliente/dashboard.html";
                }

            } catch (err) {
                console.error("Error al conectar con el Gateway:", err);
                errorDiv.innerHTML = `<div class="alert alert-danger py-2 mb-0">No se pudo conectar con el API Gateway en el puerto 8000.</div>`;
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = textoOriginal;
            }
        }
    </script>
</body>

</html>
