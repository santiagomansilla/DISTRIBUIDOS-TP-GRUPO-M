<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentar - Registro de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0b1626;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .card-registro {
            background-color: #112238;
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 580px;
            width: 100%;
        }
        .form-control, .form-select {
            background-color: #0c1828;
            border: 1px solid #1e3a5f;
            color: #fff;
        }
        .form-control:focus {
            background-color: #0c1828;
            border-color: #10b981;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25);
        }
    </style>
</head>
<body>

    <div class="card card-registro p-4 p-md-5">
        <div class="text-center mb-4">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" class="mb-2">
                <rect width="48" height="48" rx="10" fill="#0c1828"/>
                <path d="M10 32C10 32 12.5 24 16 22C18 20.8 21.5 17 25 17H34C37 17 39.5 21 40.5 24.5L42 29C42.5 30.5 41.5 32 40 32H10Z" fill="#10b981"/>
                <circle cx="16.5" cy="32.5" r="4.5" fill="#0b1626" stroke="#10b981" stroke-width="2"/>
                <circle cx="34.5" cy="32.5" r="4.5" fill="#0b1626" stroke="#10b981" stroke-width="2"/>
            </svg>
            <h3 class="fw-bold text-white mb-1">Crear Cuenta en Rentar</h3>
            <p class="text-secondary small">Completá tus datos para comenzar a reservar vehículos</p>
        </div>

        <form id="form-registro" onsubmit="ejecutarRegistro(event)">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small text-secondary">Documento (DNI) *</label>
                    <input type="text" class="form-control" id="reg-doc" placeholder="Ej: 38456123" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small text-secondary">Teléfono</label>
                    <input type="text" class="form-control" id="reg-tel" placeholder="Ej: 1123456789">
                </div>
                <div class="col-md-6">
                    <label class="form-label small text-secondary">Nombre *</label>
                    <input type="text" class="form-control" id="reg-nombre" placeholder="Tu nombre" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small text-secondary">Apellido *</label>
                    <input type="text" class="form-control" id="reg-apellido" placeholder="Tu apellido" required>
                </div>
                <div class="col-12">
                    <label class="form-label small text-secondary">Correo Electrónico *</label>
                    <input type="email" class="form-control" id="reg-email" placeholder="nombre@ejemplo.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small text-secondary">Fecha de Nacimiento</label>
                    <input type="date" class="form-control" id="reg-fecha">
                </div>
                <div class="col-md-6">
                    <label class="form-label small text-secondary">Nombre de Usuario (Username) *</label>
                    <input type="text" class="form-control" id="reg-username" placeholder="juanperez" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small text-secondary">Contraseña *</label>
                    <input type="password" class="form-control" id="reg-password" minlength="6" placeholder="Mínimo 6 caracteres" required>
                </div>
                
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold" id="btn-submit">
                        <i data-lucide="user-plus" style="width: 18px; height: 18px;" class="me-1"></i> Registrarme
                    </button>
                </div>
            </div>
        </form>

        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top border-secondary small">
            <a href="index.html" class="text-secondary text-decoration-none d-flex align-items-center gap-1">
                <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> Volver a la portada
            </a>
            <span class="text-secondary">
                ¿Ya tenés cuenta? <a href="login.html" class="text-success text-decoration-none fw-semibold">Iniciar Sesión</a>
            </span>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        lucide.createIcons();

        async function ejecutarRegistro(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registrando...';

            const payload = {
                documento: document.getElementById('reg-doc').value.trim(),
                nombre: document.getElementById('reg-nombre').value.trim(),
                apellido: document.getElementById('reg-apellido').value.trim(),
                email: document.getElementById('reg-email').value.trim().toLowerCase(),
                telefono: document.getElementById('reg-tel').value.trim() || null,
                fechaNacimiento: document.getElementById('reg-fecha').value || null,
                username: document.getElementById('reg-username').value.trim(),
                password: document.getElementById('reg-password').value
            };

            try {
                const resp = await fetch(`${GATEWAY_URL}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await resp.json();

                if (resp.ok) {
                    alert('¡Cuenta creada con éxito! Serás redirigido al inicio de sesión.');
                    window.location.href = 'login.html';
                } else {
                    alert('Error en el registro: ' + (data.detail || JSON.stringify(data)));
                }
            } catch (err) {
                alert('Error al conectar con el Gateway: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="user-plus" style="width: 18px; height: 18px;" class="me-1"></i> Registrarme';
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
