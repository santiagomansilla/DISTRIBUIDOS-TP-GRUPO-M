spring.application.name=tp-distribuidos

# ==========================================
# Conexión MariaDB (Puerto 3307 - rentar_db)
# ==========================================
spring.datasource.url=jdbc:mariadb://localhost:3307/rentar_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Deshabilitar H2
spring.h2.console.enabled=false

# ==========================================
# gRPC Server (Puerto de comunicación con Gateway)
# ==========================================
grpc.server.port=9090

# ==========================================
# RabbitMQ (Hito 3)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest