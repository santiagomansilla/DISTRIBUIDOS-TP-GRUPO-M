syntax = "proto3";

package com.unla.tp_distribuidos.grpc.auth;

option java_multiple_files = true;
option java_package = "com.unla.tp_distribuidos.grpc.auth";

service AuthGrpcService {
  rpc autenticar (LoginRequest) returns (LoginResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool autenticado = 1;
  string username = 2;
  string rol = 3;
  int64 clienteId = 4;
  string mensaje = 5;
}